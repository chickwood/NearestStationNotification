name: nearest_station_notification
description: "Locates the nearest station based on your current position."
publish_to: 'none'
version: 1.0.0-20260528+2026052802

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_foreground_task: ^9.2.2
  flutter_local_notifications: ^22.0.1
  geolocator: ^14.0.3
  package_info_plus: ^10.1.0
  # path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  # url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - ADDITIONAL_NOTICE
    - assets/station_data_xyz.bin

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon/icon.png"
  # image_path: "assets/icon/icon_notification.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png" 
  # adaptive_icon_foreground: "assets/icon/icon_notification.png"