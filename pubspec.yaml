name: nearest_station_notification
description: "Finds the nearest station using your location and sends a notification."
publish_to: 'none'
# version 格式: X.Y.Z-YYYYMMDD[-N]+YYYYMMDDNN
# (后半段 Version Code，Google Play 的规定上限 2100000000，按此编码约到 2100 年）
version: 1.1.7-20260731+2026101501

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.5.2
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter_local_notifications: ^22.3.2
  flutter_styled_toast: ^2.3.0
  geolocator: ^14.1.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - ADDITIONAL_NOTICE
    - assets/station_data_xyz.bin

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icon/icon.png"
  # image_path: "assets/icon/icon_notification.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png" 
  # adaptive_icon_foreground: "assets/icon/icon_notification.png"