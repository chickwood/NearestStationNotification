name: nearest_station_notification
description: "Finds the nearest station using your location and sends a notification."
publish_to: 'none'
# version 格式: X.Y.Z+YYYYMMDDNN
# (后半段 Version Code，Google Play 的规定上限 2100000000，按此编码约到 2100 年）
version: 1.5.9+2026112501

environment:
  sdk: '>=3.14.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.0
  crypto: ^3.0.0
  file_picker: ^13.0.0
  flutter_local_notifications: ^23.0.0
  flutter_styled_toast: ^2.0.0
  geolocator: ^14.0.0
  material_ui: ^1.0.0
  package_info_plus: ^10.0.0
  path_provider: ^2.0.0
  shared_preferences: ^2.0.0
  url_launcher: ^6.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  # flutter_launcher_icons: ^0.0.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - ADDITIONAL_NOTICE
    - assets/station_data_xyz.bin

